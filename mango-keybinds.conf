# ============================================================================
# Let the shell own its Mango options (already at the end of config.conf)
# ============================================================================
# source_optional=/home/soggygenus/.config/mango/qssettings/shell.conf

# ============================================================================
# IPC targets the shell exposes (see: qs -c end4-pC ipc show)
# ============================================================================
#   search            toggle | workspacesToggle | close | open | clipboardToggle
#   settings          toggle | open | close
#   sidebarLeft       toggle | open | close
#   sidebarRight      toggle | open | close
#   bar / verticalBar toggle | open | close
#   overlay           toggle
#   wallpaperSelector toggle | random
#   lock              activate | focus
#   session           toggle | open | close
#   region            screenshot | search | ocr | record | recordWithSound
#   brightness        increment | decrement
#   osdVolume         trigger | hide | toggle
#   mediaControls     toggle | open | close
#   screenTranslator  translate
#   background        toggleCenteredWallpaper
