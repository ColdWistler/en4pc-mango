# Quickshell (end4-pC) + MangoWM integration — REFERENCE
#
# mango-shell was removed. The lines below are what is now live in
# ~/.config/mango/config.conf (backups: config.conf.backup.<unixtime>).
#
# MangoWM has no equivalent of Hyprland's `global` shortcut protocol, so the
# shell is driven through IPC:
#
#     qs -c end4-pC ipc call <target> <fn>
#
# Reload after editing config.conf: `mmsg dispatch reload_config`

# ============================================================================
# Autostart
# ============================================================================
# exec_once=qs -c end4-pC

# ============================================================================
# Shell panels (replaced the old mango-shell signal binds)
# ============================================================================
bind=SUPER,d,spawn,qs -c end4-pC ipc call search toggle
bind=SUPER,w,spawn,qs -c end4-pC ipc call wallpaperSelector toggle
bind=SUPER,t,spawn,qs -c end4-pC ipc call search workspacesToggle
bind=SUPER+SHIFT,b,spawn_shell,pkill -x qs; sleep 0.5; qs -c end4-pC

# ============================================================================
# Brightness (like KDE's powerdevil: Fn keys emit XF86 keysyms, plus arrows)
# ============================================================================
bind=NONE,XF86MonBrightnessUp,spawn,qs -c end4-pC ipc call brightness increment
bind=NONE,XF86MonBrightnessDown,spawn,qs -c end4-pC ipc call brightness decrement
bind=SUPER+ALT,Up,spawn,qs -c end4-pC ipc call brightness increment
bind=SUPER+ALT,Down,spawn,qs -c end4-pC ipc call brightness decrement

# ============================================================================
# Volume (like KDE: XF86 keysyms + KDE's manual Ctrl+Alt+Shift+Up/Down)
# ============================================================================
# The shell's volume OSD listens on pipewire, so these show the OSD by themselves.
bind=NONE,XF86AudioRaiseVolume,spawn_shell,wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bind=NONE,XF86AudioLowerVolume,spawn_shell,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind=NONE,XF86AudioMute,spawn_shell,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind=CTRL+ALT+SHIFT,Up,spawn_shell,wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bind=CTRL+ALT+SHIFT,Down,spawn_shell,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind=CTRL+ALT,M,spawn_shell,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# ============================================================================
# Optional extra binds (keys verified free in this config; currently commented)
# ============================================================================
